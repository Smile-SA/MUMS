name: observability.prometheus
type: observability
entrypoint: run.sh

lifecycle:
  start: "<kubeconfig> <metrics_dir>"
  stop: "<kubeconfig>"

args:
  frequency_seconds: { required: false, default: 15, type: positive_int }
  local_port:        { required: false, default: 9090, type: positive_int }
  timeout_seconds:   { required: false, default: 10, type: positive_int }

dependencies:
  python: []
  commands:
    - jq          # required by scripts/lib/component_config.sh (cfg_get)
    - kubectl
    - curl
  utils:
    - utils/prometheus
    - utils/scraper
