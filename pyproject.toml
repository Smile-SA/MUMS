[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-platform"
version = "0.1.0"
description = "Benchmark platform for time-series optimization experiments."
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
benchmark-platform = "benchmark_platform.cli:main"

[tool.setuptools.packages.find]
include = ["benchmark_platform*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".venv",
  "output",
  "utils/helm/chart-repository",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
