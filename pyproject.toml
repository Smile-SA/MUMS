[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-platform"
version = "0.1.0"
description = "Benchmark platform for time-series optimization experiments."
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Smile R&D team", email = "rnd@smile.fr" },
]
keywords = ["kubernetes", "benchmark", "scheduling", "observability", "kind"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Benchmark",
]
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
benchmark-platform = "benchmark_platform.cli:main"

[tool.setuptools.packages.find]
include = ["benchmark_platform*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".venv",
  "output",
  "utils/helm/chart-repository",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
