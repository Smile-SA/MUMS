name: observability.prometheus
type: observability
contract: 1
entrypoint: run.sh

lifecycle:
  start: "<kubeconfig> <data_dir>"
  stop: "<kubeconfig>"

args:
  log_dir:           { type: string }
  extras_dir:        { type: string }
  install_prometheus: { required: false, default: true, type: bool }
  chart_version:     { required: false, default: "28.13.0", type: string }
  placement:         { required: false, default: control-plane, type: string }
  frequency_seconds: { required: false, default: 60, type: positive_int }
  local_port:        { required: false, default: 9090, type: positive_int }

dependencies:
  entrypoint: dependencies.sh
  commands:
    - kubectl
    - curl
    - python3
    - pkill
  utils:
    - utils.helm
