name: kind
type: environment
contract: 1
entrypoint: kind.sh

lifecycle:
  create: "<seed> <id> <output_file>"
  destroy: "<id>"

args:
  extras_dir:
    type: string
    description: "Directory where the module writes its other files, the kubeconfig of the created cluster included."
  node_image:
    required: false
    type: string
    description: "Kind node image, i.e. the Kubernetes version of the nodes. With cgroups v1, the image must be older than v1.35 (default: kindest/node:v1.34.0)."
  workers:
    required: false
    type: mapping
    description: "Worker nodes: {count: N, cpu: X, memory: \"YGi\"}, cpu and memory optional (default: one worker, without cpu or memory limit)."
  node_sizing:
    required: false
    type: string
    description: "How workers get the requested cpu/memory, on cgroup v1 or v2 hosts: reserved (kubelet reservations: Allocatable is right, Capacity is the host's, CPU not capped), limits (Docker limits: capped, but Capacity and Allocatable are the host's), or lxcfs (Docker limits + lxcfs: Capacity, Allocatable and caps all right; needs lxcfs on the host, whole CPUs) (default: reserved)."

dependencies:
  entrypoint: dependencies.sh
  commands:        # kind itself is checked by dependencies.sh (see kind-version)
    - docker
    - kubectl
    - jq
    - curl
  utils:
    - helm
    - metallb
