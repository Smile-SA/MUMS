name: online-boutique-locust
type: traffic
contract: 1
entrypoint: run.sh

lifecycle:
  start: "<kubeconfig> <seed> <data_dir>"
  stop: "<kubeconfig>"

args:
  log_dir:
    type: string
    description: "Directory where the module writes its logs."
  extras_dir:
    type: string
    description: "Directory where the module writes its other files: internal state (PID files...), files for debugging."
  shape:
    required: false
    type: string
    description: "Load shape: a file shapes/<shape>.py (default: day_profile)."
  cycle_minutes:
    required: false
    type: positive_int
    description: "Duration of one cycle of the shape, e.g. day_profile replays a full day in this time (default: 60)."

dependencies:
  entrypoint: dependencies.sh
  commands:        # locust: installed by dependencies.sh, declared as the contract asks
    - curl
    - python3
    - kubectl
    - locust
