name: traffic.online-boutique
type: traffic
contract: 1
entrypoint: run.sh

lifecycle:
  start: "<kubeconfig> <seed> <data_dir>"
  stop: "<kubeconfig>"

args:
  log_dir:       { type: string }
  extras_dir:    { type: string }
  shape:         { required: false, default: day_profile, type: string }
  cycle_minutes: { required: false, default: 60, type: positive_int }

dependencies:
  entrypoint: dependencies.sh
  commands:
    - curl
    - python3
    - kubectl
