# GitLab CI: syntax checks, lint and unit tests (no cluster needed).
# Same commands as a developer runs locally (see CONTRIBUTING.md).

stages:
  - check
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  image: python:3.12-slim
  cache:
    key: pip
    paths:
      - .cache/pip
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends make git > /dev/null
    - ./mums/bootstrap.sh --dev --no-shell-profile
    - export PATH="$HOME/.local/bin:$PATH"

check:
  stage: check
  script:
    - make check
    - make lint

unit-tests:
  stage: test
  script:
    - make test
