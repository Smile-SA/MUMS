name: optimizers.koordinator
type: optimizer
contract: 1
entrypoint: run.sh

lifecycle:
  start: "<kubeconfig>"

args:
  manager_replicas:     { required: false, default: 1, type: positive_int }
  scheduler_replicas:   { required: false, default: 1, type: positive_int }
  descheduler_replicas: { required: false, default: 1, type: positive_int }

dependencies:
  entrypoint: dependencies.sh
  commands:
    - kubectl
  utils:
    - utils.helm
