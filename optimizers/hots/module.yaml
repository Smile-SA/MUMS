name: optimizers.hots
type: optimizer
entrypoint: run.sh

lifecycle:
  deploy: "<kubeconfig>"
  start:  "<kubeconfig>"
  stop:   "<kubeconfig>"

args:
  kafka_port:            { required: false, default: 9092, type: positive_int }
  prometheus_url:        { required: false, default: "http://127.0.0.1:9090", type: string }
  k8s_workload_identity: { required: false, default: pod, type: string }
  k8s_node_label_key:    { required: false, default: "kubernetes.io/hostname", type: string }
  namespace:             { required: false, default: online-boutique, type: string }
  metric:                { required: false, default: cpu, type: string }
  nb_clusters:           { required: false, default: 3, type: positive_int }
  tick_seconds:          { required: false, default: 10, type: positive_int }

dependencies:
  python: []
  commands:
    - hots
    - hots-connector
    - docker
    - kubectl
    - jq
  utils:
    - utils/kafka
