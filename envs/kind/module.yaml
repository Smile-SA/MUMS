name: envs.kind
type: environment
entrypoint: run.sh

lifecycle:
  create: "<seed> <result_file>"
  destroy: "<seed>"

args:
  node_image: { required: false, type: string }
  workers:    { required: false, type: mapping }
  metallb:    { required: false, type: mapping }

dependencies:
  python: []
  commands:
    - jq          # required by scripts/lib/component_config.sh (cfg_get)
    - docker
    - kind
    - kubectl
    - helm
  utils:
    - utils/kind
    - utils/metallb
    - utils/prometheus
    - utils/helm
