name: envs.kind
type: environment
contract: 1
entrypoint: kind.sh

lifecycle:
  create: "<seed> <id> <output_file>"
  destroy: "<id>"

args:
  extras_dir: { type: string }
  node_image: { required: false, type: string, default: "kindest/node:v1.34.0" }
  workers:    { required: false, type: mapping }

dependencies:
  python: []
  commands:
    - jq
    - docker
    - kind
    - kubectl
    - helm
  checks:
    - docker info
  utils:
    - utils/kind
    - utils/metallb
    - utils/prometheus
    - utils/helm
