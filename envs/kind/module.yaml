name: envs.kind
type: environment
contract: 1
entrypoint: kind.sh

lifecycle:
  create: "<seed> <id> <output_file>"
  destroy: "<id>"

args:
  extras_dir: { type: string }
  node_image: { required: false, type: string, default: "kindest/node:v1.34.0" }
  workers:    { required: false, type: mapping }
  cgroups:    { required: false, type: string, default: "v1" }

dependencies:
  entrypoint: dependencies.sh
  commands:        # kind itself is checked by dependencies.sh (see kind-version)
    - docker
    - kubectl
    - jq
  utils:
    - utils.helm
    - utils.metallb
