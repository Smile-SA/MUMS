name: traffic.online-boutique
type: traffic
entrypoint: run.sh

lifecycle:
  start: "<kubeconfig> <seed>"
  stop: "<kubeconfig>"

args:
  shape:         { required: false, default: day_profile, type: string }
  cycle_minutes: { required: false, default: 60, type: positive_int }

dependencies:
  python:
    - requirements.txt
  commands:
    - jq          # required by scripts/lib/component_config.sh (cfg_get)
  utils: []
