name: traffic.online-boutique
type: traffic
contract: 1
entrypoint: run.sh

lifecycle:
  start: "<kubeconfig> <seed> <output_dir>"
  stop: "<kubeconfig>"

args:
  log_dir:       { type: string }
  extras_dir:    { type: string }
  shape:         { required: false, default: day_profile, type: string }
  cycle_minutes: { required: false, default: 60, type: positive_int }

dependencies:
  python:
    - requirements.txt
  commands:
    - locust
    - kubectl
    - curl
  utils: []
