version: 1

scenario:
  name: hots-online-boutique-15min
  seed: 42
  duration_seconds: 900

environment:
  module: envs.kind
  node_image: kindest/node:v1.34.0
  workers:
    count: 2
    cpu: "2"
    memory: "4Gi"

stack:
  module: stacks.online-boutique

observability:
  module: observability.prometheus
  frequency_seconds: 15
  local_port: 9090         # <-- if you change this, update optimizer.prometheus_url below

traffic:
  module: traffic.online-boutique
  shape: day_profile
  cycle_minutes: 60

optimizer:
  module: optimizers.hots
  prometheus_url: http://127.0.0.1:9090   # <-- must match observability.local_port above
  kafka_port: 9092
  namespace: online-boutique
  metric: cpu
  nb_clusters: 3
  tick_seconds: 10

post-processing:
  - module: post-processing.essential-tables
  - module: post-processing.basic-evaluation
  - module: post-processing.pod-based-node-evaluation

output:
  root_directory: output/runs
  cleanup_environment: true
