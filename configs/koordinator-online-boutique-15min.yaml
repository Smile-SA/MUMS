version: 1

scenario:
  name: koordinator-online-boutique-15min
  seed: 42
  duration_seconds: 900

environment:
  module: kind
  node_sizing: lxcfs
  node_image: kindest/node:v1.34.0
  workers:
    count: 2
    cpu: "2"
    memory: "4Gi"

stack:
  module: online-boutique-v0.10.1

observability:
  module: prometheus-live-scraper
  frequency_seconds: 15
  local_port: 9090

traffic:
  module: online-boutique-locust
  shape: day_profile
  cycle_minutes: 15          # one simulated day per run (60 would replay only 00:00-06:00)

optimizer:
  module: koordinator

disruption:
  module: no-disruption

post-processing:
  - module: essential-tables
  - module: basic-evaluation
    node_metrics: false        # kind: nodes share the host, node-exporter sees the host
    namespaces: online-boutique
  - module: pod-based-node-evaluation

output:
  root_directory: output
  cleanup_environment: true
