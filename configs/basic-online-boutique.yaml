version: 1

scenario:
  name: basic-online-boutique
  seed: 42
  duration_seconds: 120

environment:
  type: kind
  module: envs/kind
  node_image: kindest/node:v1.34.0
  workers:
    count: 2
    cpu: "2"
    memory: "4Gi"
  metallb:
    ip_range: auto

stack:
  type: online-boutique
  module: stacks/online-boutique

observability:
  type: prometheus
  module: observability/prometheus
  frequency_seconds: 15
  local_port: 9090
  timeout_seconds: 10

traffic:
  type: locust
  module: traffic/online-boutique
  shape: journee_type
  cycle_minutes: 60

optimizer:
  type: baseline
  module: optimizers/baseline

dataset:
  type: refined-csv
  module: observability/analysis
  enabled: true

output:
  root_directory: output/runs
  cleanup_environment: true
