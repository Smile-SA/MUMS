version: 1

scenario:
  name: basic-online-boutique
  seed: 42
  duration_seconds: 120

environment:
  type: kind
  node_image: kindest/node:v1.34.0
  workers:
    count: 2
    cpu: "2"
    memory: "4Gi"
  metallb:
    ip_range: auto

stack:
  type: online-boutique

observability:
  type: prometheus
  frequency_seconds: 15
  local_port: 9090

traffic:
  type: locust
  shape: journee_type
  cycle_minutes: 60

optimizer:
  type: baseline

output:
  root_directory: output/runs
  cleanup_environment: true
