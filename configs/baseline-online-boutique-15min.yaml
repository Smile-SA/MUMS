version: 1

scenario:
  name: baseline-online-boutique-15min
  seed: 42
  duration_seconds: 900

environment:
  module: envs.kind
  node_image: kindest/node:v1.34.0
  workers:
    count: 2
    cpu: "2"
    memory: "4Gi"

stack:
  module: stacks.online-boutique

observability:
  module: observability.prometheus
  frequency_seconds: 15
  local_port: 9090

traffic:
  module: traffic.online-boutique
  shape: day_profile
  cycle_minutes: 60

optimizer:
  module: optimizers.baseline

post-processing:
  - module: post-processing.essential-tables
  - module: post-processing.basic-evaluation
  - module: post-processing.pod-based-node-evaluation

output:
  root_directory: output/runs
  cleanup_environment: true
