# The platform's core, installed from this directory: `pip install -e .`, or with
# the development tools, `pip install -e ".[dev]"` (see bootstrap.sh).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-platform"
version = "0.1.0"
description = "Benchmark platform for Kubernetes optimizers (schedulers, deschedulers, autoscalers), in real clusters."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "Smile R&D team", email = "rnd@smile.fr" },
]
keywords = ["kubernetes", "benchmark", "scheduling", "optimization", "observability"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Benchmark",
]
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1.0",
]

[project.scripts]
benchmark-platform = "benchmark_platform.cli:main"

# This directory is the package itself.
[tool.setuptools]
package-dir = { "benchmark_platform" = "." }
packages = ["benchmark_platform"]

# Lint of the whole repository (`make lint` passes this file with --config).
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["benchmark_platform", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
